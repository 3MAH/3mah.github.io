name: Documentation
on:
  push:
    branches:
      - master
      - main
  # Rebuilt when a library documentation is republished
  # (simcoon / fedoo / microgen docs workflows send a "docs-updated" event)
  repository_dispatch:
    types: [docs-updated]
  # Weekly refresh of the example gallery, and a manual button
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install "zensical>=0.1.3,<0.2"
      - name: Collect examples from the Sphinx galleries
        run: python scripts/build_examples.py
      - run: zensical build --clean
      - name: Check links to the Sphinx documentation
        run: python scripts/check_doc_links.py site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
